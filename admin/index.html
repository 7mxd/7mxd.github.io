<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager · Ahmed's Portfolio</title>

  <!-- Set the theme before first paint so the page never flashes the wrong ground. -->
  <script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) { stored = null; }
    var theme = 'light';
    if (stored === 'light' || stored === 'dark') {
      theme = stored;
    } else {
      try {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {
        theme = 'light';
      }
    }
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1f30' : '#eaf0fb');
  })();
  </script>

  <!-- This page answers at both /admin and /admin/, and the host redirects
       neither, so anything naming a file inside admin/ is written from the
       root. Written relative, "admin.css" is /admin/admin.css from one URL
       and /admin.css from the other. The two below need no such help: ../
       clamps at the root, so they resolve the same way from both. -->
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <section id="login" hidden>
    <div class="login-card">
      <h1>Content Manager</h1>
      <p>Edit your portfolio content. Changes commit to <code>main</code> and publish your site.</p>
      <button id="signin" class="btn">Sign in with GitHub</button>
      <p id="login-error" class="err" role="alert"></p>
    </div>
  </section>

  <section id="app" hidden>
    <header id="topbar">
      <span class="brand">Content Manager</span>
      <span id="who" class="who"></span>
      <span class="spacer"></span>
      <span id="save-status" class="save-status" aria-live="polite"></span>
      <!-- Beside the status line, never inside it: that span is aria-live, so
           a button parked in there would be re-announced on every status
           change. Hidden until there is something to put back. -->
      <button id="undo" class="btn ghost" hidden></button>
      <button id="save" class="btn">Save</button>
      <button id="signout" class="btn ghost">Sign out</button>
    </header>
    <div class="layout">
      <nav id="collections" aria-label="Content navigation"></nav>
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" id="view-path-btn" class="btn ghost" aria-pressed="false">Path</button>
        <button type="button" id="view-form-btn" class="btn ghost" aria-pressed="true">Form</button>
        <button type="button" id="view-preview-btn" class="btn ghost" aria-pressed="false">Preview</button>
      </div>
      <main id="panel"></main>
      <aside id="preview-pane" aria-label="Preview">
        <iframe id="preview" src="/" title="Preview of the site"></iframe>
      </aside>
    </div>
  </section>

  <!-- Root-absolute for the reason the stylesheet above is: a 404 here is not
       a missing script, it is a blank page, since both sections start hidden
       and this module is what reveals one. -->
  <script type="module" src="/admin/app.js"></script>
</body>
</html>
