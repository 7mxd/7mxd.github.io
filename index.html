<!-- One tag, not two media-keyed ones. The theme is a data-theme attribute the
     visitor toggles, not the OS preference a media condition sees, so the
     pre-paint script below and js/theme.js both write this to match the ground
     actually rendered. The literal here is the light value: what the script
     resolves to before it runs, and what manifest.json pins.

     It has to be parsed BEFORE that script. It sat below it for one commit,
     which made the script's querySelector return null and left every dark
     reader under a light address bar until the module graph resolved.
     test/index-html.test.js pins the order. -->
<meta name="theme-color" content="#eaf0fb">

<!-- Set the theme before first paint so the page never flashes the wrong ground. -->
<script>
(function () {
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch (e) { stored = null; }
  var theme = 'light';
  if (stored === 'light' || stored === 'dark') {
    theme = stored;
  } else {
    try {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) {
      theme = 'light';
    }
  }
  document.documentElement.setAttribute('data-theme', theme);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1f30' : '#eaf0fb');
})();
</script>

<!-- Hero portrait is eager and preloaded, per the design spec.
     imagesrcset/imagesizes must mirror the image element js/render.js emits, or the
     browser preloads one candidate and then downloads a different one for the image
     itself — 199KB of it, on the LCP path, for a mark 176 CSS pixels wide. The href
     is the no-imagesrcset fallback and must match profile.portrait.src.
     test/render.test.js pins all three to what render.js actually produces. -->
<link rel="preload" as="image" href="assets/photos/derived/portrait-formal-1600.jpg"
      imagesrcset="assets/photos/derived/portrait-formal-800.jpg 622w, assets/photos/derived/portrait-formal-1600.jpg 827w"
